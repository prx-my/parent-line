# Copy to family.toml and fill in. family.toml is git-ignored.

parent_name = "Mom"
# How the Guardian is addressed in the family group: its alias there, or its registered name.
guardian = "@guardian"
# The Clerk: keeps the case file and gets the reminder before the bank's reporting deadline.
# Leave it out and reminders go to the Guardian.
clerk = "@clerk"
# The family group's Switch room id (Switch Console → the room → copy id).
room_id = ""
# Shared secret the SMS-forwarder app sends as ?key=… or the X-Bankwatch-Key header.
# Or set BANKWATCH_SECRET in the environment.
webhook_secret = ""
# The Bank watch agent's credentials file, written by Switch Console in the agent's working directory.
# Or set SWITCH_API_ENDPOINT, SWITCH_API_TOKEN and SWITCH_AGENT_ID in the environment.
credentials = "bank-watch/.switch/agents/bank-watch.json"
state_file = "bankwatch-state.json"

# Payees the parent pays regularly. Big debits to them still alarm; they just aren't "new".
known_payees = ["SHARMA KIRANA STORE", "CITY ELECTRICITY BOARD"]

# What the Guardian knows about the family. `python3 -m bankwatch setup` writes it into the room's instructions.
[family]
parent_phone = "+91 98765 43210"
members = ["Riya", "Arjun"]          # names as the Telegram group shows them
backup_contact = "Mr Sharma, next-door neighbour, +91 91234 56789"
banks = ["SBI"]

# Ride watch: anyone in the group writes "@ride-watch 25 min" before a ride alone at night.
# Past that time it asks if they reached; with no answer it raises the alarm for the Guardian.
[ride]
name = "@ride-watch"         # how people address it in the group
credentials = "ride-watch/.switch/agents/ride-watch.json"
state_file = "ridewatch-state.json"
grace_minutes = 10           # after the expected arrival, before asking "have you reached?"
answer_minutes = 5           # after asking, before the alarm
code_word = "pizza"          # "@ride-watch pizza" raises the alarm at once; "" for none

# Optional: X keys for the Clerk's public posts (an X developer app with Read and Write, OAuth 1.0a).
# Without them the Clerk's posts stop at "NOT POSTED". About $0.01 a post on X's pay-per-use API.
# [x]
# api_key = ""
# api_secret = ""
# access_token = ""
# access_secret = ""

[rules]
large_debit = 50000       # ₹: any single debit at or above this
new_payee_min = 10000     # ₹: a debit this big to a payee never paid before
burst_count = 3           # this many debits...
burst_minutes = 60        # ...within this many minutes...
burst_min_total = 25000   # ...adding up to at least this, ₹
night_start = "22:00"     # a debit between these times...
night_end = "06:00"
night_min = 5000          # ...of at least this, ₹
